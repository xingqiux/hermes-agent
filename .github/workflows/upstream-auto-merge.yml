name: 合并已审核的官方同步

on:
  workflow_run:
    workflows: [CI, Fork goals]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: upstream-auto-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.repository == 'xingqiux/hermes-agent' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: fork-automation
    env:
      GH_TOKEN: ${{ secrets.FORK_AUTOMATION_TOKEN }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: 通过全部门禁后合并
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo '::error::没有配置 Fork 自动化令牌'; exit 1; }

          pr=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" \
            --jq '[.[] | select(.state == "open")][0].number // empty')
          [[ -n "$pr" ]] || { echo '当前提交没有对应的开放 PR'; exit 0; }

          data=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" \
            --json baseRefOid,headRefName,headRefOid,isCrossRepository,isDraft,labels,mergeable)
          base_sha=$(jq -r '.baseRefOid' <<<"$data")
          branch=$(jq -r '.headRefName' <<<"$data")
          sha=$(jq -r '.headRefOid' <<<"$data")
          [[ "$branch" == sync/v* && "$sha" == "$HEAD_SHA" ]] || {
            echo '这不是当前官方同步 PR 的最新提交'
            exit 0
          }
          [[ $(jq -r '.isCrossRepository' <<<"$data") == false ]]
          [[ $(jq -r '.isDraft' <<<"$data") == false ]] || {
            echo 'PR 仍是 Draft，等待 Hermes 完成审核'; exit 0;
          }
          jq -e '.labels | any(.name == "hermes-reviewed")' <<<"$data" >/dev/null || {
            echo '缺少 hermes-reviewed 审核标签'; exit 0;
          }

          changed=$(git diff --no-ext-diff --name-only "$base_sha...$sha")
          if grep -Eq '^\.github/(workflows|actions)/' <<<"$changed"; then
            jq -e '.labels | any(.name == "ci-reviewed")' <<<"$data" >/dev/null || {
              echo '修改了 CI 相关文件，还缺少 ci-reviewed 标签'; exit 0;
            }
          fi

          request=$(gh api "repos/${GITHUB_REPOSITORY}/contents/.xkqq/sync-request.json?ref=${HEAD_SHA}" \
            --jq .content | base64 --decode)
          tag=$(jq -r '.tag' <<<"$request")
          [[ $(jq -r '.merge_status' <<<"$request") == merged ]] || {
            echo 'Hermes 还没有完成记录中的官方合并'; exit 0;
          }
          tag_sha=$(gh api "repos/NousResearch/hermes-agent/commits/${tag}" --jq .sha)
          relation=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${tag_sha}...${HEAD_SHA}" --jq .status)
          [[ "$relation" == ahead || "$relation" == identical ]] || {
            echo "::error::官方标签 $tag 不是当前 PR 的祖先提交"
            exit 1
          }

          checks=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100")
          for required in 'All required checks pass' 'Fork goal contracts'; do
            jq -e --arg name "$required" \
              'any(.check_runs[]; .name == $name and .conclusion == "success")' \
              <<<"$checks" >/dev/null || {
                echo "$required 尚未成功"
                exit 0
              }
          done

          for _ in 1 2 3 4 5 6; do
            mergeable=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json mergeable --jq .mergeable)
            [[ "$mergeable" != UNKNOWN ]] && break
            sleep 10
          done
          [[ "$mergeable" == MERGEABLE ]] || {
            echo "::error::PR 当前不可合并：$mergeable"
            exit 1
          }
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --merge --delete-branch \
            --match-head-commit "$HEAD_SHA"
