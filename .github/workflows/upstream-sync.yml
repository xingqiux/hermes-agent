name: 检查官方稳定版

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-stable-sync
  cancel-in-progress: false

jobs:
  detect:
    if: github.repository == 'xingqiux/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: fork-automation
    env:
      GH_TOKEN: ${{ secrets.FORK_AUTOMATION_TOKEN }}
      UPSTREAM_REPO: NousResearch/hermes-agent
    steps:
      - name: 检查自动化凭据
        run: test -n "$GH_TOKEN" || { echo '::error::没有配置 Fork 自动化令牌'; exit 1; }

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.FORK_AUTOMATION_TOKEN }}

      - name: 检查版本并创建同步 PR
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          release=$(gh api "repos/${UPSTREAM_REPO}/releases/latest")
          tag=$(jq -r '.tag_name' <<<"$release")
          draft=$(jq -r '.draft' <<<"$release")
          prerelease=$(jq -r '.prerelease' <<<"$release")
          published_at=$(jq -r '.published_at' <<<"$release")

          [[ "$draft" == false && "$prerelease" == false ]]
          [[ "$tag" =~ ^v[0-9]{4}\.[0-9]+\.[0-9]+([.][0-9]+)?$ ]] || {
            echo "::error::官方稳定版标签格式异常：$tag"
            exit 1
          }

          git fetch --force https://github.com/NousResearch/hermes-agent.git \
            "refs/tags/${tag}:refs/tags/${tag}"
          version=$(git show "${tag}:pyproject.toml" | awk -F'"' '/^version = / {print $2; exit}')
          [[ -n "$version" ]] || { echo "::error::无法从 $tag 读取版本号"; exit 1; }
          if git merge-base --is-ancestor "$tag" HEAD; then
            echo "官方稳定版 $tag 已经包含在 main 中"
            echo "notify=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch="sync/${tag}"
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --label upstream-sync \
            --json number,headRefName --jq ".[] | select(.headRefName != \"$branch\") | .number" |
          while read -r old_pr; do
            [[ -z "$old_pr" ]] || gh pr close "$old_pr" --repo "$GITHUB_REPOSITORY" \
              --comment "已由最新稳定版 ${tag} 的同步任务取代。"
          done

          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --head "$branch" --json number --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            echo "同步 PR #$existing 已经存在"
            echo "notify=true" >> "$GITHUB_OUTPUT"
            echo "pr=$existing" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name xkqq-upstream-sync
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "$branch"

          status=merged
          conflict_json='[]'
          if ! git merge --no-ff --no-edit "$tag"; then
            status=conflicts
            conflict_json=$(git diff --name-only --diff-filter=U | jq -R . | jq -s .)
            git merge --abort
          fi

          mkdir -p .xkqq
          jq -n \
            --arg repository "$UPSTREAM_REPO" \
            --arg tag "$tag" \
            --arg published_at "$published_at" \
            --arg status "$status" \
            --argjson conflicts "$conflict_json" \
            '{repository:$repository, tag:$tag, published_at:$published_at,
              merge_status:$status, conflicts:$conflicts}' \
            > .xkqq/sync-request.json
          jq --arg tag "$tag" --arg version "$version" \
            '.stable_tag = $tag | .version = $version' .xkqq/upstream.json \
            > .xkqq/upstream.json.tmp
          mv .xkqq/upstream.json.tmp .xkqq/upstream.json
          git add .xkqq/upstream.json .xkqq/sync-request.json
          git commit -m "chore(upstream): prepare ${tag} review"
          git push --set-upstream origin "$branch"

          gh label create upstream-sync --repo "$GITHUB_REPOSITORY" \
            --color 1D76DB --description '官方稳定版同步任务' --force
          gh label create hermes-reviewed --repo "$GITHUB_REPOSITORY" \
            --color 0E8A16 --description 'Hermes 已完成 Fork 目标审核' --force
          gh label create ci-reviewed --repo "$GITHUB_REPOSITORY" \
            --color 0E8A16 --description 'CI 相关修改已审核' --force
          pr_url=$(gh pr create --repo "$GITHUB_REPOSITORY" --draft \
            --base main --head "$branch" --label upstream-sync \
            --title "chore(upstream): 同步官方稳定版 ${tag}" \
            --body "这是官方稳定版 ${tag} 的自动同步请求。请按照 .xkqq/FORK_GOALS.md 审核。当前上游合并状态：${status}。")
          pr=${pr_url##*/}
          echo "notify=true" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: 通知 Hermes 审核同步任务
        if: steps.sync.outputs.notify == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.HERMES_SYNC_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.HERMES_SYNC_WEBHOOK_SECRET }}
          PR: ${{ steps.sync.outputs.pr }}
          TAG: ${{ steps.sync.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WEBHOOK_URL" && test -n "$WEBHOOK_SECRET" || {
            echo '::error::没有配置 Hermes Webhook 地址或签名密钥'
            exit 1
          }
          body=$(jq -nc \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson pull_request "$PR" \
            --arg tag "$TAG" \
            '{repository:$repository,pull_request:$pull_request,tag:$tag,
              goals_path:".xkqq/FORK_GOALS.md",event_type:"upstream_sync"}')
          timestamp=$(date +%s)
          signature=$(BODY="$body" TS="$timestamp" SECRET="$WEBHOOK_SECRET" python3 -c \
            'import hashlib,hmac,os; print(hmac.new(os.environ["SECRET"].encode(), (os.environ["TS"]+"."+os.environ["BODY"]).encode(), hashlib.sha256).hexdigest())')
          curl --fail-with-body --retry 3 --retry-all-errors \
            -H 'Content-Type: application/json' \
            -H 'X-Webhook-Event: upstream_sync' \
            -H "X-Webhook-Timestamp: $timestamp" \
            -H "X-Webhook-Signature-V2: $signature" \
            --data "$body" "$WEBHOOK_URL"

      - name: 写入中文同步结果
        if: steps.sync.outputs.notify == 'true'
        env:
          PR: ${{ steps.sync.outputs.pr }}
          TAG: ${{ steps.sync.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          pr_url=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          {
            echo "## 官方版本同步任务已创建"
            echo
            echo "- 官方版本：\`$TAG\`"
            echo "- 同步 PR：[#${PR}](${pr_url})"
            echo "- 状态：已通知 Hermes，等待审核和冲突处理"
            echo
            echo "审核完成后，Hermes 需要移除 Draft 并添加 \`hermes-reviewed\` 标签。自动合并门禁仍会检查全部 CI 和目标契约。"
          } >> "$GITHUB_STEP_SUMMARY"
