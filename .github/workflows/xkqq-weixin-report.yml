name: Report xkqq deployment to Weixin

on:
  workflow_run:
    workflows: [Build and deploy xkqq image]
    branches: [main]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: xkqq-weixin-report-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  notify:
    if: github.repository == 'xingqiux/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: fork-automation
    env:
      GH_TOKEN: ${{ github.token }}
      SYNC_WEBHOOK_URL: ${{ secrets.HERMES_SYNC_WEBHOOK_URL }}
      WEBHOOK_SECRET: ${{ secrets.HERMES_SYNC_WEBHOOK_SECRET }}
      REVISION: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - name: Send deployment result to Weixin
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SYNC_WEBHOOK_URL" && test -n "$WEBHOOK_SECRET" || {
            echo '::error::Hermes webhook URL or secret is not configured'
            exit 1
          }

          jobs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100")
          build_result=$(jq -r '[.jobs[] | select(.name == "build")][0].conclusion // "not_run"' <<<"$jobs")
          deploy_result=$(jq -r '[.jobs[] | select(.name == "deploy")][0].conclusion // "not_run"' <<<"$jobs")
          prune_result=$(jq -r '[.jobs[] | select(.name == "prune-registry")][0].conclusion // "not_run"' <<<"$jobs")
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/contents/.xkqq/upstream.json?ref=${REVISION}" \
            --jq .content | base64 --decode | jq -r '.stable_tag // "unknown"')
          short_revision=${REVISION:0:10}

          if [[ "$build_result" == success && "$deploy_result" == success && "$prune_result" == success ]]; then
            message=$(printf 'Hermes 自动部署完成\n\n版本：%s\n提交：%s\nDashboard：正常\nTelegram、微信、NapCat：已连接\n旧镜像：已清理\n详情：%s' "$tag" "$short_revision" "$SOURCE_RUN_URL")
          elif [[ "$deploy_result" == success ]]; then
            message=$(printf 'Hermes 自动部署已上线，但后续清理失败\n\n版本：%s\n提交：%s\n镜像清理：%s\n详情：%s' "$tag" "$short_revision" "$prune_result" "$SOURCE_RUN_URL")
          elif [[ "$build_result" != success ]]; then
            message=$(printf 'Hermes 自动构建失败\n\n版本：%s\n提交：%s\n生产环境未切换。\n详情：%s' "$tag" "$short_revision" "$SOURCE_RUN_URL")
          else
            message=$(printf 'Hermes 自动部署失败\n\n版本：%s\n提交：%s\n部署脚本已尝试自动回滚，请检查 Actions。\n详情：%s' "$tag" "$short_revision" "$SOURCE_RUN_URL")
          fi

          webhook_url="${SYNC_WEBHOOK_URL%/*}/xkqq-deploy-report"
          body=$(jq -nc --arg message "$message" \
            '{message:$message,event_type:"deployment_report"}')
          timestamp=$(date +%s)
          signature=$(BODY="$body" TS="$timestamp" SECRET="$WEBHOOK_SECRET" python3 -c \
            'import hashlib,hmac,os; print(hmac.new(os.environ["SECRET"].encode(), (os.environ["TS"]+"."+os.environ["BODY"]).encode(), hashlib.sha256).hexdigest())')
          curl --fail-with-body --retry 3 --retry-all-errors \
            -H 'Content-Type: application/json' \
            -H 'X-Webhook-Event: deployment_report' \
            -H "X-Webhook-Timestamp: $timestamp" \
            -H "X-Webhook-Signature-V2: $signature" \
            --data "$body" "$webhook_url"
